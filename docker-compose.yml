services:
  mysql:
    image: mysql:8.0
    container_name: miumiu_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: miumiu_db
      MYSQL_USER: miumiu_user
      MYSQL_PASSWORD: miumiu_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - miumiu_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootpassword"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: dev
    container_name: miumiu_backend
    restart: unless-stopped
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: miumiu_user
      DB_PASSWORD: miumiu_password
      DB_NAME: miumiu_db
      APP_PORT: 8080
      GIN_MODE: debug
    ports:
      - "8080:8080"
    volumes:
      - ./backend:/app
      - go_pkg_cache:/go/pkg/mod
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - miumiu_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: runner
    container_name: miumiu_frontend
    restart: unless-stopped
    environment:
      NODE_ENV: development
      NEXT_PUBLIC_API_URL: http://localhost/api
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
      - frontend_next_cache:/app/.next
    networks:
      - miumiu_network

  nginx:
    image: nginx:alpine
    container_name: miumiu_nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
    depends_on:
      - backend
      - frontend
    networks:
      - miumiu_network

volumes:
  mysql_data:
  go_pkg_cache:
  frontend_node_modules:
  frontend_next_cache:

networks:
  miumiu_network:
    driver: bridge
